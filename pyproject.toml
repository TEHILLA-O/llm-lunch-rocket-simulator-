[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarmind"
version = "1.0.0"
description = "LunarMind: a reinforcement-learning rocket landing research project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "gymnasium>=1.0",
  "stable-baselines3>=2.3",
  "torch>=2.2",
  "pygame>=2.5",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.6",
  "tensorboard>=2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
baseline = ["gymnasium[box2d]>=1.0"]

[tool.setuptools.packages.find]
include = ["simulation*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]
